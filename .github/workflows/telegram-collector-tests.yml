name: Telegram Collector Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'telegram-collector/**'
      - '.github/workflows/telegram-collector-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'telegram-collector/**'
      - '.github/workflows/telegram-collector-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run collector unit tests (no DB, no Docker, no provider)
        run: node --test telegram-collector/services/__tests__/channelPolling.stabilization.test.js telegram-collector/services/__tests__/messageProcessor.scheduling.test.js
