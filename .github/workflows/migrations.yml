name: Database Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/database/**'
      - 'backend/scripts/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/.npmrc'
      - '.github/workflows/migrations.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/database/**'
      - 'backend/scripts/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/.npmrc'
      - '.github/workflows/migrations.yml'

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: titangold_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Align with production backend runtime (Node 20.19.x)
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Bootstrap disposable schema + migration tracking
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/titangold_test
        run: |
          # Apply base schema, then register migration history (CI design of
          # migrate:setup). Do not rewrite migration files or touch Staging/Prod.
          cd backend
          node scripts/ci_apply_base_schema.js
          npm run migrate:setup
          npm run migrate:up

      - name: Check migration status
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/titangold_test
        run: |
          cd backend
          npm run migrate:status

      - name: Run backend unit tests against migrated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/titangold_test
          NODE_ENV: test
        run: |
          cd backend
          npm run test:unit

  deploy:
    name: Deploy Migrations (Production)
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Run migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          cd backend
          npm run migrate:up

      - name: Verify migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          cd backend
          npm run migrate:status
