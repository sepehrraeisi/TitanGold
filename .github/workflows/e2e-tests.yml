# PR-safe E2E workflow — disposable PostgreSQL + backend + login fixture.
name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'e2e/**'
      - 'components/**'
      - 'src/**'
      - 'backend/**'
      - 'playwright.config.ts'
      - 'playwright.ci.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'e2e/**'
      - 'components/**'
      - 'src/**'
      - 'backend/**'
      - 'playwright.config.ts'
      - 'playwright.ci.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/e2e-tests.yml'

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: titangold_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/titangold_test?sslmode=disable
      DB_SSL: 'false'
      JWT_SECRET: test
      TITAN_DEPLOY_ENV: staging
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3010,http://localhost:3010
      TITAN_E2E_TARGET_ENV: staging
      TITAN_E2E_FIXTURE_OWNER: github-actions-pr-safe
      TITAN_E2E_FIXTURE_USERNAME: e2e_pr_safe_fixture
      TITAN_E2E_FIXTURE_EMAIL: e2e-pr-safe-fixture@titangold.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Bootstrap disposable schema for login E2E
        run: |
          cd backend
          node scripts/ci_apply_base_schema.js
          npm run migrate:setup
          npm run migrate:up

      - name: Prepare disposable login fixture
        run: |
          cd backend
          node scripts/prepare_login_e2e_fixture.js \
            --quiet-secrets \
            --output-file .e2e-login.env \
            --fixture-username "$TITAN_E2E_FIXTURE_USERNAME" \
            --fixture-email "$TITAN_E2E_FIXTURE_EMAIL" \
            --fixture-owner "$TITAN_E2E_FIXTURE_OWNER" \
            --target-env "$TITAN_E2E_TARGET_ENV"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run PR-safe Playwright suite
        run: |
          set -a
          source backend/.e2e-login.env
          set +a
          npx playwright test --config=playwright.ci.config.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3010
          RUN_LOGIN_E2E: '1'
          TITAN_E2E_BACKEND_DIR: /home/runner/work/TitanGold/TitanGold/backend
          VITE_DISABLE_DEV_LOGIN_FALLBACK: 'true'
          VITE_API_PROXY_TARGET: 'http://127.0.0.1:5002'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore
