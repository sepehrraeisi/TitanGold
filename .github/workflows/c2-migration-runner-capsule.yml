name: C2 Migration Runner Capsule

on:
  pull_request:
    paths:
      - 'tools/c2-migration-runner-capsule/**'
      - '.github/workflows/c2-migration-runner-capsule.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Empty = VERIFY_ONLY. PUBLISH_C2_CAPSULE_D2 = publish. Any other value fails closed.'
        required: false
        default: ''
      source_commit:
        description: 'Exact source commit SHA to publish'
        required: false
        default: ''
      expected_archive_sha256:
        description: 'Expected capsule archive SHA256'
        required: false
        default: ''
      release_tag:
        description: 'Must be exactly c2-runner-capsule-<first 12 chars of source_commit>'
        required: false
        default: ''

permissions:
  contents: read

env:
  SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

jobs:
  dispatch_contract:
    name: C2 Capsule Dispatch Contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Validate dispatch intent
        id: gate
        env:
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
          INPUT_SOURCE: ${{ github.event.inputs.source_commit }}
          INPUT_SHA: ${{ github.event.inputs.expected_archive_sha256 }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          CONFIRM="${INPUT_CONFIRM:-}"
          SOURCE="${INPUT_SOURCE:-}"
          SHA="${INPUT_SHA:-}"
          TAG="${INPUT_TAG:-}"
          if [[ -z "${CONFIRM}" ]]; then
            if [[ -n "${SOURCE}" || -n "${SHA}" || -n "${TAG}" ]]; then
              echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: VERIFY_ONLY forbids publish-only inputs" >&2
              exit 1
            fi
            echo "C2_CAPSULE_DISPATCH_MODE=VERIFY_ONLY"
            echo "mode=VERIFY_ONLY" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${CONFIRM}" != "PUBLISH_C2_CAPSULE_D2" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: invalid confirm token" >&2
            exit 1
          fi
          echo "C2_CAPSULE_DISPATCH_MODE=PUBLISH"
          echo "mode=PUBLISH" >> "${GITHUB_OUTPUT}"

  build:
    name: C2 Capsule Build
    needs: [dispatch_contract]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || needs.dispatch_contract.result == 'success') }}
    runs-on: ubuntu-22.04
    outputs:
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      archive_bytes: ${{ steps.pack.outputs.archive_bytes }}
      source_commit: ${{ steps.pack.outputs.source_commit }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Prove source identity
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_COMMIT="$(git rev-parse HEAD)"
          echo "EXPECTED_SOURCE_REF=${SOURCE_REF}"
          echo "ACTUAL_SOURCE_COMMIT=${ACTUAL_SOURCE_COMMIT}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          test "${ACTUAL_SOURCE_COMMIT}" = "${SOURCE_REF}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${ACTUAL_SOURCE_COMMIT}" != "${GITHUB_SHA}"
          fi

      - name: Setup Node 20.19.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'

      - name: Record toolchain
        run: |
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          test "$(node --version)" = "v20.19.5"

      - name: Validate lockfile
        run: |
          node tools/c2-migration-runner-capsule/scripts/inventory.mjs \
            --validate-lock tools/c2-migration-runner-capsule/package-lock.json

      - name: Double-build reproducibility
        id: pack
        run: |
          set -euo pipefail
          chmod +x tools/c2-migration-runner-capsule/scripts/*.sh
          ACTUAL_SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${ACTUAL_SOURCE_COMMIT}" = "${SOURCE_REF}"
          export SOURCE_COMMIT="${ACTUAL_SOURCE_COMMIT}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          OUT_A="${RUNNER_TEMP}/c2-out-a"
          OUT_B="${RUNNER_TEMP}/c2-out-b"
          mkdir -p "${OUT_A}" "${OUT_B}"
          OUT_DIR="${OUT_A}" tools/c2-migration-runner-capsule/scripts/build-artifact.sh | tee "${RUNNER_TEMP}/build-a.txt"
          OUT_DIR="${OUT_B}" tools/c2-migration-runner-capsule/scripts/build-artifact.sh | tee "${RUNNER_TEMP}/build-b.txt"
          SHA_A="$(awk -F= '/^ARCHIVE_SHA256=/{print $2}' "${RUNNER_TEMP}/build-a.txt")"
          SHA_B="$(awk -F= '/^ARCHIVE_SHA256=/{print $2}' "${RUNNER_TEMP}/build-b.txt")"
          BYTES_A="$(awk -F= '/^ARCHIVE_BYTES=/{print $2}' "${RUNNER_TEMP}/build-a.txt")"
          SRC_A="$(awk -F= '/^SOURCE_COMMIT=/{print $2}' "${RUNNER_TEMP}/build-a.txt")"
          echo "build A ${SHA_A}"
          echo "build B ${SHA_B}"
          echo "PR_HEAD_SHA=${SOURCE_REF}"
          echo "ARTIFACT_MANIFEST_SOURCE_COMMIT=${SRC_A}"
          if [[ "${SHA_A}" != "${SHA_B}" ]]; then
            echo "DETERMINISTIC_CAPSULE_ARTIFACT=FAIL" >&2
            exit 1
          fi
          test "${SRC_A}" = "${ACTUAL_SOURCE_COMMIT}"
          cp "${OUT_A}/titangold-c2-runner-linux-x64-node20.19.5.tar.gz" "${RUNNER_TEMP}/capsule.tar.gz"
          echo "${SHA_A}  titangold-c2-runner-linux-x64-node20.19.5.tar.gz" > "${RUNNER_TEMP}/capsule.sha256"
          echo "archive_sha256=${SHA_A}" >> "${GITHUB_OUTPUT}"
          echo "archive_bytes=${BYTES_A}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${ACTUAL_SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Upload intra-CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c2-runner-capsule
          path: |
            ${{ runner.temp }}/capsule.tar.gz
            ${{ runner.temp }}/capsule.sha256
          if-no-files-found: error
          retention-days: 7

  consumer:
    name: C2 Capsule Clean Consumer
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Prove consumer source identity
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "PR_HEAD_SHA=${{ needs.build.outputs.source_commit }}"
          echo "CHECKED_OUT=${ACTUAL}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          test "${ACTUAL}" = "${{ needs.build.outputs.source_commit }}"

      - name: Setup Node 20.19.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'

      - name: Download capsule artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c2-runner-capsule
          path: ${{ runner.temp }}/c2-in

      - name: Verify without npm
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          chmod +x tools/c2-migration-runner-capsule/scripts/verify-artifact.sh
          EXPECTED="${{ needs.build.outputs.archive_sha256 }}"
          ACTUAL="$(sha256sum "${RUNNER_TEMP}/c2-in/capsule.tar.gz" | awk '{print $1}')"
          echo "consumer actual ${ACTUAL}"
          echo "build expected ${EXPECTED}"
          test "${ACTUAL}" = "${EXPECTED}"
          EXTRACT="${RUNNER_TEMP}/c2-extract"
          mkdir -p "${EXTRACT}"
          tools/c2-migration-runner-capsule/scripts/verify-artifact.sh \
            "${RUNNER_TEMP}/c2-in/capsule.tar.gz" \
            "${EXPECTED}" \
            "${EXTRACT}"
          CAPSULE="${EXTRACT}/titangold-c2-runner"
          MANIFEST="${CAPSULE}/manifests/capsule-manifest.json"
          MANIFEST_SOURCE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceCommit"])' "${MANIFEST}")"
          echo "PR_HEAD_SHA=${{ needs.build.outputs.source_commit }}"
          echo "ARTIFACT_MANIFEST_SOURCE_COMMIT=${MANIFEST_SOURCE}"
          test "${MANIFEST_SOURCE}" = "${{ needs.build.outputs.source_commit }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${MANIFEST_SOURCE}" != "${GITHUB_SHA}"
          fi
          test ! -e "${CAPSULE}/052_telegram_messages_channel_message_id_index.js"
          if grep -R --include='*.js' -l 'C2_052_INDEX_ALREADY_EXISTS_STOP' "${CAPSULE}"; then
            echo 'C2_CAPSULE_SELF_TEST_FAILED: 052 source leaked into capsule' >&2
            exit 1
          fi
          echo 'NO_052_SOURCE_IN_CAPSULE'
          node --input-type=module -e "
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.argv[1];
          const require = createRequire(path.join(root, 'package.json'));
          for (const name of ['node-pg-migrate', 'pg', 'glob', 'yargs']) {
            const resolved = fs.realpathSync(require.resolve(name));
            const prefix = fs.realpathSync(root) + path.sep;
            if (!resolved.startsWith(prefix)) {
              console.error('C2_CAPSULE_MODULE_ESCAPE ' + name + ' ' + resolved);
              process.exit(1);
            }
            if (resolved.includes(path.sep + 'backend' + path.sep + 'node_modules' + path.sep)) {
              console.error('C2_CAPSULE_MODULE_ESCAPE backend ' + resolved);
              process.exit(1);
            }
            console.log('RESOLVED', name, resolved);
          }
          " "${CAPSULE}"
          if command -v strace >/dev/null 2>&1; then
            strace -f -e trace=connect -o "${RUNNER_TEMP}/self-test.strace" \
              node "${CAPSULE}/bin/c2-self-test.mjs"
            if grep -E 'AF_INET|AF_INET6' "${RUNNER_TEMP}/self-test.strace"; then
              echo 'C2_CAPSULE_SELF_TEST_FAILED: unexpected inet connect' >&2
              exit 1
            fi
            echo 'OFFLINE_STRACE_PASS'
          else
            echo 'OFFLINE_STRACE_UNAVAILABLE using self-test only'
            node "${CAPSULE}/bin/c2-self-test.mjs"
          fi
          command -v npm >/dev/null
          echo 'CONSUMER_NO_NPM_INSTALL_BY_CONTRACT'

  pg14:
    name: C2 Capsule PG14 Integration
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    services:
      postgres:
        image: postgres:14@sha256:2fdfb9b432d4a73bd3eea3d989752c1e669b68d502347e0bfd2cc6d709f3d6b4
        env:
          POSTGRES_DB: titangold_c2_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TITAN_C2_CI_PG14: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Prove PG14 source identity
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "PR_HEAD_SHA=${{ needs.build.outputs.source_commit }}"
          echo "CHECKED_OUT=${ACTUAL}"
          test "${ACTUAL}" = "${{ needs.build.outputs.source_commit }}"

      - name: Setup Node 20.19.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'

      - name: Download capsule artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c2-runner-capsule
          path: ${{ runner.temp }}/c2-in

      - name: Stage 052 and extract capsule
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          chmod +x tools/c2-migration-runner-capsule/scripts/verify-artifact.sh
          EXTRACT="${RUNNER_TEMP}/c2-pg-extract"
          mkdir -p "${EXTRACT}"
          tools/c2-migration-runner-capsule/scripts/verify-artifact.sh \
            "${RUNNER_TEMP}/c2-in/capsule.tar.gz" \
            "${{ needs.build.outputs.archive_sha256 }}" \
            "${EXTRACT}"
          echo "CAPSULE=${EXTRACT}/titangold-c2-runner" >> "${GITHUB_ENV}"
          MIGDIR="${RUNNER_TEMP}/c2-onefile"
          mkdir -p "${MIGDIR}"
          SRC="backend/database/migrations/052_telegram_messages_channel_message_id_index.js"
          ACTUAL="$(sha256sum "${SRC}" | awk '{print $1}')"
          test "${ACTUAL}" = "2c7c5723b20fd823102fb78f8cd97664453e3fcbb07ece56efb4ec0bd444f082"
          cp "${SRC}" "${MIGDIR}/052_telegram_messages_channel_message_id_index.js"
          echo "MIGDIR=${MIGDIR}" >> "${GITHUB_ENV}"
          EXTRA="${RUNNER_TEMP}/c2-extra"
          mkdir -p "${EXTRA}"
          cp "${SRC}" "${EXTRA}/052_telegram_messages_channel_message_id_index.js"
          cp backend/database/migrations/050_mexc_capability_snapshots_rollback.sql \
            "${EXTRA}/050_mexc_capability_snapshots_rollback.sql"
          cp backend/database/migrations/051_artemis_b10_decision_persistence.sql \
            "${EXTRA}/051_artemis_b10_decision_persistence.sql"
          echo "EXTRA=${EXTRA}" >> "${GITHUB_ENV}"

      - name: Extra-file launcher rejection
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          set +e
          out="$(node "${CAPSULE}/bin/c2-migrate.mjs" up "${EXTRA}" 2>&1)"
          rc=$?
          set -e
          echo "${out}"
          test "${rc}" -ne 0
          echo "${out}" | grep -q 'C2_CAPSULE_EXTRA_MIGRATION_FILE'

      - name: Create disposable databases
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          node --input-type=module -e "
          import { createRequire } from 'node:module';
          import path from 'node:path';
          const require = createRequire(path.join(process.argv[1], 'package.json'));
          const pg = require('pg');
          const client = new pg.Client({
            connectionString: 'postgresql://postgres@127.0.0.1:5432/titangold_c2_test?sslmode=disable',
          });
          await client.connect();
          const { rows } = await client.query('SHOW server_version');
          const major = String(rows[0].server_version).split('.')[0];
          if (major !== '14') {
            throw new Error('disposable server major must remain 14, got ' + rows[0].server_version);
          }
          for (const db of ['titangold_c2_wrong','titangold_c2_partial','titangold_c2_invalid','titangold_c2_down','titangold_c2_named']) {
            await client.query('CREATE DATABASE ' + db);
          }
          await client.end();
          " "${CAPSULE}"

      - name: Copy verifier beside capsule pg
        run: |
          cp backend/scripts/ci_verify_c2_052.js "${CAPSULE}/_ci_verify_c2_052.mjs"

      - name: Happy-path up / plan / second up / down
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/titangold_c2_test?sslmode=disable
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          node "${CAPSULE}/_ci_verify_c2_052.mjs" require-pg14
          node "${CAPSULE}/_ci_verify_c2_052.mjs" bootstrap-fixture
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-pre-plan
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-post-apply
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-post-plan
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-named-file-isolation
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-idempotent-state
          node "${CAPSULE}/bin/c2-migrate.mjs" down "${MIGDIR}"
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-down-state
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-post-apply

      - name: Wrong-definition fail-closed
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/titangold_c2_wrong?sslmode=disable
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          node "${CAPSULE}/_ci_verify_c2_052.mjs" setup-wrong-index
          set +e
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          rc=$?
          set -e
          test "${rc}" -ne 0
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-wrong-untouched

      - name: Valid-index ledger-absent retry fail-closed
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/titangold_c2_partial?sslmode=disable
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          node "${CAPSULE}/_ci_verify_c2_052.mjs" setup-partial-trap
          set +e
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          rc=$?
          set -e
          test "${rc}" -ne 0
          node "${CAPSULE}/_ci_verify_c2_052.mjs" drop-partial-trap
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-partial-valid-ledger-absent
          set +e
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          rc=$?
          set -e
          test "${rc}" -ne 0
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-partial-valid-ledger-absent

      - name: Invalid-index fail-closed
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/titangold_c2_invalid?sslmode=disable
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          node "${CAPSULE}/_ci_verify_c2_052.mjs" setup-invalid-index
          set +e
          node "${CAPSULE}/bin/c2-migrate.mjs" up "${MIGDIR}"
          rc=$?
          set -e
          test "${rc}" -ne 0
          node "${CAPSULE}/_ci_verify_c2_052.mjs" prove-invalid-refused

  publish:
    name: C2 Capsule Manual D2 Publish
    runs-on: ubuntu-22.04
    needs: [dispatch_contract, build, consumer, pg14]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'PUBLISH_C2_CAPSULE_D2' }}
    permissions:
      contents: write
    steps:
      - name: Fail-closed publish gates
        env:
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
          INPUT_SOURCE: ${{ github.event.inputs.source_commit }}
          INPUT_SHA: ${{ github.event.inputs.expected_archive_sha256 }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          BUILD_SOURCE: ${{ needs.build.outputs.source_commit }}
          BUILD_SHA: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: not workflow_dispatch" >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: not main" >&2
            exit 1
          fi
          if [[ "${INPUT_CONFIRM}" != "PUBLISH_C2_CAPSULE_D2" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: confirmation token mismatch" >&2
            exit 1
          fi
          if [[ -z "${INPUT_SOURCE}" || "${{ github.sha }}" != "${INPUT_SOURCE}" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: github.sha != input source_commit" >&2
            exit 1
          fi
          if [[ "${BUILD_SOURCE}" != "${INPUT_SOURCE}" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: build source_commit != input source_commit" >&2
            exit 1
          fi
          if [[ -z "${INPUT_SHA}" || "${BUILD_SHA}" != "${INPUT_SHA}" ]]; then
            echo "C2_CAPSULE_SHA_MISMATCH: expected archive mismatch" >&2
            exit 1
          fi
          EXPECTED_TAG="c2-runner-capsule-${INPUT_SOURCE:0:12}"
          if [[ -z "${INPUT_TAG}" || "${INPUT_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: release_tag must be ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Prove publish source identity
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "${ACTUAL}" = "${{ needs.build.outputs.source_commit }}"
          test "${ACTUAL}" = "${{ github.event.inputs.source_commit }}"

      - name: Setup Node 20.19.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'

      - name: Download same-run capsule artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c2-runner-capsule
          path: ${{ runner.temp }}/c2-in

      - name: Recheck archive SHA and verify artifact
        env:
          BUILD_SHA: ${{ needs.build.outputs.archive_sha256 }}
          INPUT_SHA: ${{ github.event.inputs.expected_archive_sha256 }}
        run: |
          set -euo pipefail
          unset NODE_PATH || true
          chmod +x tools/c2-migration-runner-capsule/scripts/verify-artifact.sh
          INNER="${RUNNER_TEMP}/c2-in/capsule.tar.gz"
          ACTUAL="$(sha256sum "${INNER}" | awk '{print $1}')"
          echo "publish recomputed ${ACTUAL}"
          test "${ACTUAL}" = "${BUILD_SHA}"
          test "${ACTUAL}" = "${INPUT_SHA}"
          EXTRACT="${RUNNER_TEMP}/c2-publish-extract"
          mkdir -p "${EXTRACT}"
          tools/c2-migration-runner-capsule/scripts/verify-artifact.sh \
            "${INNER}" \
            "${ACTUAL}" \
            "${EXTRACT}"
          echo "INNER_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "INNER_ARCHIVE=${INNER}" >> "${GITHUB_ENV}"

      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "${INPUT_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: release already exists" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${INPUT_TAG}" >/dev/null 2>&1; then
            echo "C2_CAPSULE_DELIVERY_PROVENANCE_UNVERIFIED: git tag already exists" >&2
            exit 1
          fi

      - name: Create GitHub Release from same-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          ASSET_NAME="titangold-c2-runner-linux-x64-node20.19.5.tar.gz"
          ASSET_DIR="${RUNNER_TEMP}/c2-release-assets"
          mkdir -p "${ASSET_DIR}"
          cp "${INNER_ARCHIVE}" "${ASSET_DIR}/${ASSET_NAME}"
          echo "${INNER_SHA}  ${ASSET_NAME}" > "${ASSET_DIR}/${ASSET_NAME}.sha256"
          test "$(sha256sum "${ASSET_DIR}/${ASSET_NAME}" | awk '{print $1}')" = "${INNER_SHA}"
          BODY="$(cat <<EOF
          TitanGold C2 offline migration runner capsule.

          Source commit: ${SOURCE_COMMIT}
          Capsule archive SHA256: ${INNER_SHA}
          Node: v20.19.5
          Platform: linux x64
          node-pg-migrate: 8.0.4
          pg: 8.16.3

          C2-only maintenance tool. Canonical 052 is NOT contained in this artifact.
          GitHub Release/tag/URL is transport only. CONTENT SHA256 is the trust authority.
          EOF
          )"
          gh release create "${INPUT_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_COMMIT}" \
            --title "C2 runner capsule ${SOURCE_COMMIT:0:12}" \
            --notes "${BODY}" \
            "${ASSET_DIR}/${ASSET_NAME}" \
            "${ASSET_DIR}/${ASSET_NAME}.sha256"
