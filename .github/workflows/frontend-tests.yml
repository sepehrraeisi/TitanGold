name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'components/**'
      - 'utils/**'
      - 'services/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'components/**'
      - 'utils/**'
      - 'services/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    # Vite 7 requires Node ^20.19.0 || >=22.12.0 (see node_modules/vite engines).
    # Production frontend/runtime is Node 20.19.x — do not matrix Node 18 here.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm run test:run -- src/__tests__/

    - name: Generate coverage report
      run: npm run test:coverage -- src/__tests__/
      continue-on-error: true

    - name: Upload coverage to Codecov (optional)
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        files: ./coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
