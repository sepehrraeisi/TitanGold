name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    # Production runtime is Node 20.19.x.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: titangold_test
          POSTGRES_USER: postgres
          # Disposable runner-local DB only — no password, trust auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/titangold_test?sslmode=disable
      DB_SSL: 'false'
      NODE_ENV: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: |
        cd backend
        npm ci

    - name: Prepare schema for DB-touching unit tests
      env:
        DATABASE_URL: postgresql://postgres@localhost:5432/titangold_test?sslmode=disable
        DB_SSL: 'false'
      run: |
        # Base product schema for disposable CI DB, then register migration history.
        cd backend
        node scripts/ci_apply_base_schema.js
        npm run migrate:setup
        # setup_migrations.js records only *.sql; 052.js remains pending.
        # Minimal disposable telegram_messages so migrate:up can apply C2.
        # Not production C2 execution.
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS telegram_messages (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            message_id bigint NOT NULL,
            channel_id uuid
          );
        "
        npm run migrate:up

    - name: Run unit tests
      run: |
        cd backend
        npm run test:unit

    - name: Run integration tests
      run: |
        cd backend
        npm run test:integration
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        cd backend
        npm run test:ci
      continue-on-error: true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage-${{ matrix.node-version }}
        fail_ci_if_error: false

    - name: Archive coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-node-${{ matrix.node-version }}
        path: backend/coverage/
        retention-days: 30
        if-no-files-found: ignore
