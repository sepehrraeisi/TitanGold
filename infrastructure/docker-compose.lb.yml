# ============================================================================
# TitanGold Load Balancer Docker Compose (INFRA-009)
# ============================================================================
#
# Purpose: Deploy nginx load balancer with automatic SSL certificate management
#
# Features:
#   - Nginx load balancer with production configuration
#   - Automatic SSL certificate generation and renewal via Certbot
#   - Health check monitoring
#   - Log volume for persistent logging
#   - Network isolation
#
# Usage:
#   docker-compose -f infrastructure/docker-compose.lb.yml up -d
#
# Date: 2026-01-31
# ============================================================================

version: '3.8'

services:
  # ========================================================================
  # Nginx Load Balancer
  # ========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: titangold-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      
      # SSL certificates (Let's Encrypt)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      
      # DH parameters
      - ./dhparam.pem:/etc/nginx/dhparam.pem:ro
      
      # Logs
      - nginx_logs:/var/log/nginx
      
      # Cache
      - nginx_cache:/var/cache/nginx
      
      # Frontend static files (if serving from load balancer)
      - ../../dist:/var/www/titangold/dist:ro
    networks:
      - titangold_network
    depends_on:
      - certbot
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.titangold.service=load-balancer"
      - "com.titangold.task=INFRA-009"
    command: >
      /bin/sh -c "
      # Wait for SSL certificates
      while [ ! -f /etc/letsencrypt/live/api.titangold.com/fullchain.pem ]; do
        echo 'Waiting for SSL certificates...'
        sleep 5
      done
      
      # Start nginx
      nginx -g 'daemon off;'
      "
  
  # ========================================================================
  # Certbot (SSL Certificate Management)
  # ========================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: titangold-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    networks:
      - titangold_network
    entrypoint: >
      /bin/sh -c "
      # Initial certificate generation (run once)
      if [ ! -f /etc/letsencrypt/live/api.titangold.com/fullchain.pem ]; then
        echo 'Generating initial SSL certificates...'
        certbot certonly --webroot --webroot-path=/var/www/certbot \
          --email admin@titangold.com \
          --agree-tos \
          --no-eff-email \
          --force-renewal \
          -d api.titangold.com \
          -d titangold.com \
          -d www.titangold.com
      fi
      
      # Certificate renewal loop (every 12 hours)
      trap exit TERM
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot
        sleep 12h & wait $!
      done
      "

# ========================================================================
# Networks
# ========================================================================
networks:
  titangold_network:
    driver: bridge
    name: titangold_network

# ========================================================================
# Volumes
# ========================================================================
volumes:
  nginx_logs:
    name: titangold_nginx_logs
  nginx_cache:
    name: titangold_nginx_cache
