# ============================================================================
# TitanGold Load Balancer Configuration (INFRA-009)
# ============================================================================
#
# Purpose: Production-grade nginx load balancer for TitanGold backend
#
# Features:
#   - Multiple backend instance support with round-robin load balancing
#   - Health checks with automatic failover
#   - SSL/TLS termination with modern security settings
#   - Sticky sessions for WebSocket and stateful connections
#   - Request rate limiting and DDoS protection
#   - Static file caching and gzip compression
#   - Security headers and CORS configuration
#   - Access and error logging
#
# Date: 2026-01-31
# Task: INFRA-009 - Set Up Load Balancer
# ============================================================================

# Define upstream backend servers
# Add more backend instances here as you scale
upstream titangold_backend {
    # Load balancing method: least_conn, ip_hash, or round_robin (default)
    least_conn;  # Route to server with least active connections
    
    # Backend server instances
    # Add additional servers as: server backend2.titangold.com:5002 max_fails=3 fail_timeout=30s;
    server localhost:5002 max_fails=3 fail_timeout=30s weight=1;
    # server localhost:5003 max_fails=3 fail_timeout=30s weight=1;  # Example: Additional instance
    # server 10.0.1.10:5002 max_fails=3 fail_timeout=30s weight=1;  # Example: Remote instance
    
    # Keepalive connections to backend
    keepalive 32;
    keepalive_timeout 60s;
}

# Rate limiting zones
# Limit requests to prevent DDoS and abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=50r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Cache zones for static content
proxy_cache_path /var/cache/nginx/titangold levels=1:2 keys_zone=titangold_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ============================================================================
# HTTP Server (Redirect to HTTPS)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name titangold.com www.titangold.com api.titangold.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS Server - API Backend
# ============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.titangold.com;
    
    # ========================================================================
    # SSL/TLS Configuration (SSL Termination)
    # ========================================================================
    
    # SSL certificates (update paths to your actual certificates)
    ssl_certificate /etc/letsencrypt/live/api.titangold.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.titangold.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.titangold.com/chain.pem;
    
    # SSL protocols and ciphers (Modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL session cache and timeout
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Diffie-Hellman parameter for DHE ciphersuites
    # Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096
    ssl_dhparam /etc/nginx/dhparam.pem;
    
    # ========================================================================
    # Security Headers
    # ========================================================================
    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ========================================================================
    # Logging
    # ========================================================================
    
    access_log /var/log/nginx/titangold-access.log combined;
    error_log /var/log/nginx/titangold-error.log warn;
    
    # ========================================================================
    # General Settings
    # ========================================================================
    
    # Client body size limit (for file uploads)
    client_max_body_size 10M;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # Connection limiting
    limit_conn addr 50;
    
    # ========================================================================
    # Health Check Endpoint (for load balancer monitoring)
    # ========================================================================
    
    location /health {
        access_log off;
        proxy_pass http://titangold_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health check specific settings
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }
    
    # ========================================================================
    # WebSocket Endpoints (with sticky sessions)
    # ========================================================================
    
    location ~ ^/ws/(notifications|favorites|agents) {
        proxy_pass http://titangold_backend;
        
        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Sticky session using IP hash for WebSocket connections
        # This ensures clients reconnect to the same backend instance
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        
        # Rate limiting for WebSocket connections
        limit_req zone=api_limit burst=20 nodelay;
    }
    
    # ========================================================================
    # Authentication Endpoints (stricter rate limiting)
    # ========================================================================
    
    location ~ ^/api/v1/(auth|login|register|reset-password) {
        # Strict rate limiting for auth endpoints
        limit_req zone=auth_limit burst=5 nodelay;
        
        proxy_pass http://titangold_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # Standard proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    
    # ========================================================================
    # Webhook Endpoints
    # ========================================================================
    
    location /api/v1/webhooks {
        # Rate limiting for webhooks
        limit_req zone=webhook_limit burst=10 nodelay;
        
        proxy_pass http://titangold_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # Preserve webhook signature headers
        proxy_set_header X-TitanGold-Signature $http_x_titangold_signature;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    
    # ========================================================================
    # GraphQL Endpoint
    # ========================================================================
    
    location /graphql {
        # Rate limiting
        limit_req zone=api_limit burst=30 nodelay;
        
        proxy_pass http://titangold_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    
    # ========================================================================
    # Telegram Collector (^~ = priority prefix; must be before /api/ block)
    # ========================================================================
    
    location ^~ /api/telegram-collector {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://localhost:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ========================================================================
    # API Endpoints (General)
    # ========================================================================
    
    location /api/ {
        # General API rate limiting
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://titangold_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Enable buffering for better performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache control
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # ========================================================================
    # Metrics Endpoint (restrict access)
    # ========================================================================
    
    location /metrics {
        # Restrict to internal IPs only
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://titangold_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        access_log off;
    }
    
    # ========================================================================
    # Root / Catch-all
    # ========================================================================
    
    location / {
        proxy_pass http://titangold_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ============================================================================
# HTTPS Server - Frontend Application
# ============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name titangold.com www.titangold.com;
    
    # Root directory for frontend static files
    root /var/www/titangold/dist;
    index index.html;
    
    # SSL configuration (same as API)
    ssl_certificate /etc/letsencrypt/live/titangold.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titangold.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/titangold.com/chain.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_dhparam /etc/nginx/dhparam.pem;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/titangold-frontend-access.log combined;
    error_log /var/log/nginx/titangold-frontend-error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
